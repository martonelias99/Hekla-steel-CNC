<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hekla Steel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-4">
    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg gap-4">
            <div>
                <h1 class="text-2xl font-bold text-amber-400">🔥 Hekla Steel</h1>
                <p class="text-sm text-slate-400">Status Cloud: <span id="syncStatus" class="text-amber-500 font-semibold">Se conectează...</span></p>
            </div>
            <div class="flex flex-wrap gap-2 w-full md:w-auto">
                <button onclick="syncFromCloud()" class="flex-1 md:flex-none bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
                    🔄 Sincronizează
                </button>
                <button onclick="openModal()" class="flex-1 md:flex-none bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm shadow transition">
                    + Adaugă Comandă
                </button>
            </div>
        </header>

        <!-- Filtre -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <input type="text" id="searchFilter" placeholder="Caută client, marcă sau comandă..." oninput="renderApp()" class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-amber-500">
            <select id="thicknessFilter" onchange="renderApp()" class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-amber-500">
                <option value="">Toate grosimile (Table)</option>
            </select>
            <select id="statusFilter" onchange="renderApp()" class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-amber-500">
                <option value="">Toate statusurile</option>
                <option value="netaiat">Netăiat</option>
                <option value="taiat">Tăiat (Parțial / Total)</option>
                <option value="livrat">Livrat</option>
            </select>
        </div>

        <!-- Tabel Comenzi / Piese -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 shadow-xl overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-slate-700 text-slate-400 text-xs uppercase bg-slate-850">
                        <th class="p-3">Client / Comandă</th>
                        <th class="p-3">Grosime</th>
                        <th class="p-3">Marcă / Piese</th>
                        <th class="p-3 text-center">Tăiat / Necesar</th>
                        <th class="p-3 text-center">Status</th>
                        <th class="p-3 text-right">Acțiuni la aparat</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody" class="divide-y divide-slate-700 text-sm">
                    <!-- Dinamic -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Adăugare Comandă -->
    <div id="orderModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl">
            <h2 class="text-xl font-bold mb-4 text-amber-400">Adaugă Comandă / Fișiere DXF</h2>
            <form id="orderForm" onsubmit="saveOrder(event)" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase text-slate-400 mb-1">Nume Client</label>
                    <input type="text" id="clientName" required placeholder="ex: SC Metal SRL" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs uppercase text-slate-400 mb-1">Număr Comandă (opțional)</label>
                    <input type="text" id="orderNo" placeholder="ex: CMD-2026-05" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs uppercase text-slate-400 mb-1">Nume fișiere DXF / DWG (sau text)</label>
                    <p class="text-xs text-slate-500 mb-1">Ex: tg6 - p101 - 30 buc (câte unul pe rând sau selectează fișierele)</p>
                    <input type="file" id="dxfFiles" multiple accept=".dxf,.dwg" onchange="handleFiles(this)" class="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-amber-400 hover:file:bg-slate-600 mb-2">
                    <textarea id="rawLines" rows="5" placeholder="tg6 - p101 - 30 buc&#10;tg8 - p102 - 12 buc" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white font-mono text-xs focus:outline-none focus:border-amber-500"></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeModal()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg transition">Anulează</button>
                    <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-lg transition">Salvează</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let orders = [];
        const apiKey = "$2a$10$b6UGrDZodyvQPc/dsJh3NunNzMz9VaJLu611IEWgRfiQkODIEMzbK";
        const binId = "6af5a159ffd5d16053bbccdd";

        // Pornire automată cu sincronizare din cloud
        syncFromCloud();

        function openModal() { 
            document.getElementById('orderModal').classList.remove('hidden'); 
            document.getElementById('orderModal').classList.add('flex'); 
        }
        
        function closeModal() { 
            document.getElementById('orderModal').classList.add('hidden'); 
            document.getElementById('orderModal').classList.remove('flex'); 
        }

        async function syncToCloud() {
            localStorage.setItem('cnc_orders', JSON.stringify(orders));
            const statusEl = document.getElementById('syncStatus');
            statusEl.innerText = "Se salvează în cloud...";
            statusEl.className = "text-amber-400 font-semibold";
            
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': apiKey
                    },
                    body: JSON.stringify({ orders: orders })
                });
                if (response.ok) {
                    statusEl.innerText = "Sincronizat ✓";
                    statusEl.className = "text-emerald-400 font-semibold";
                } else {
                    throw new Error("Eroare server");
                }
            } catch (err) {
                statusEl.innerText = "Eroare salvare cloud!";
                statusEl.className = "text-rose-500 font-semibold";
            }
        }

        async function syncFromCloud() {
            const statusEl = document.getElementById('syncStatus');
            statusEl.innerText = "Se descarcă datele...";
            statusEl.className = "text-amber-400 font-semibold";
            
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
                    headers: {
                        'X-Master-Key': apiKey
                    }
                });
                const data = await response.json();
                if (data.record && Array.isArray(data.record.orders)) {
                    orders = data.record.orders;
                    localStorage.setItem('cnc_orders', JSON.stringify(orders));
                    statusEl.innerText = "Sincronizat ✓";
                    statusEl.className = "text-emerald-400 font-semibold";
                } else {
                    // Dacă bin-ul e nou și nu are cheia 'orders'
                    orders = [];
                    statusEl.innerText = "Conectat (Gol) ✓";
                    statusEl.className = "text-emerald-400 font-semibold";
                }
                renderApp();
            } catch (err) {
                statusEl.innerText = "Offline (Date locale)";
                statusEl.className = "text-rose-500 font-semibold";
                orders = JSON.parse(localStorage.getItem('cnc_orders')) || [];
                renderApp();
            }
        }

        function handleFiles(input) {
            let textOutput = "";
            for (let file of input.files) {
                let name = file.name.replace(/\.[^/.]+$/, "");
                textOutput += name + "\n";
            }
            document.getElementById('rawLines').value += textOutput;
        }

        function saveOrder(e) {
            e.preventDefault();
            const client = document.getElementById('clientName').value;
            const orderNo = document.getElementById('orderNo').value || '-';
            const rawText = document.getElementById('rawLines').value;

            const lines = rawText.split('\n');
            const items = [];

            lines.forEach(line => {
                if (!line.trim()) return;
                const parts = line.split('-').map(p => p.trim());
                let grosime = parts[0] || 'tg?';
                let marca = parts[1] || 'piese';
                let cantStr = parts[2] || '1';
                let cantitate = parseInt(cantStr.replace(/\D/g, '')) || 1;

                items.push({
                    id: Date.now() + Math.random(),
                    grosime: grosime.toUpperCase(),
                    marca: marca,
                    necesar: cantitate,
                    taiat: 0,
                    livrat: false
                });
            });

            orders.push({ id: Date.now(), client, orderNo, items });
            syncToCloud();
            closeModal();
            document.getElementById('orderForm').reset();
            renderApp();
        }

        function updateCut(orderId, itemId, delta) {
            orders = orders.map(ord => {
                if (ord.id === orderId) {
                    ord.items = ord.items.map(item => {
                        if (item.id === itemId) {
                            item.taiat = Math.max(0, Math.min(item.necesar, item.taiat + delta));
                        }
                        return item;
                    });
                }
                return ord;
            });
            syncToCloud();
            renderApp();
        }

        function toggleDeliver(orderId, itemId) {
            orders = orders.map(ord => {
                if (ord.id === orderId) {
                    ord.items = ord.items.map(item => {
                        if (item.id === itemId) {
                            item.livrat = !item.livrat;
                        }
                        return item;
                    });
                }
                return ord;
            });
            syncToCloud();
            renderApp();
        }

        function renderApp() {
            const search = document.getElementById('searchFilter').value.toLowerCase();
            const thickVal = document.getElementById('thicknessFilter').value;
            const statusVal = document.getElementById('statusFilter').value;

            const tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = '';

            let thicknesses = new Set();
            orders.forEach(ord => ord.items.forEach(i => thicknesses.add(i.grosime)));
            const thickSelect = document.getElementById('thicknessFilter');
            const currentThick = thickSelect.value;
            thickSelect.innerHTML = '<option value="">Toate grosimile (Table)</option>';
            Array.from(thicknesses).sort().forEach(t => {
                thickSelect.innerHTML += `<option value="${t}" ${t === currentThick ? 'selected' : ''}>${t}</option>`;
            });

            let hasRows = false;

            orders.forEach(ord => {
                ord.items.forEach(item => {
                    const matchesSearch = ord.client.toLowerCase().includes(search) || ord.orderNo.toLowerCase().includes(search) || item.marca.toLowerCase().includes(search);
                    const matchesThick = !thickVal || item.grosime === thickVal;
                    
                    let matchesStatus = true;
                    if (statusVal === 'netaiat') matchesStatus = (item.taiat === 0 && !item.livrat);
                    if (statusVal === 'taiat') matchesStatus = (item.taiat > 0);
                    if (statusVal === 'livrat') matchesStatus = item.livrat;

                    if (!matchesSearch || !matchesThick || !matchesStatus) return;

                    hasRows = true;

                    let statusBadge = `<span class="bg-rose-500/20 text-rose-400 px-2.5 py-1 rounded-full text-xs font-semibold">Netăiat</span>`;
                    if (item.taiat > 0 && item.taiat < item.necesar) statusBadge = `<span class="bg-amber-500/20 text-amber-400 px-2.5 py-1 rounded-full text-xs font-semibold">Parțial (${item.taiat}/${item.necesar})</span>`;
                    if (item.taiat >= item.necesar) statusBadge = `<span class="bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-full text-xs font-semibold">Tăiat Complet</span>`;
                    if (item.livrat) statusBadge = `<span class="bg-blue-500/20 text-blue-400 px-2.5 py-1 rounded-full text-xs font-semibold">Livrat</span>`;

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-750 transition";
                    tr.innerHTML = `
                        <td class="p-3">
                            <div class="font-bold text-white">${ord.client}</div>
                            <div class="text-xs text-slate-400">Cmd: ${ord.orderNo}</div>
                        </td>
                        <td class="p-3 font-mono text-amber-400 font-semibold">${item.grosime}</td>
                        <td class="p-3 font-medium">${item.marca}</td>
                        <td class="p-3 text-center font-mono">
                            <span class="${item.taiat >= item.necesar ? 'text-emerald-400 font-bold' : 'text-white'}">${item.taiat}</span> / ${item.necesar}
                        </td>
                        <td class="p-3 text-center">${statusBadge}</td>
                        <td class="p-3 text-right flex items-center justify-end gap-1.5">
                            <button onclick="updateCut(${ord.id}, ${item.id}, -1)" class="bg-slate-700 hover:bg-slate-600 text-white w-8 h-8 rounded-lg font-bold text-sm">-1</button>
                            <button onclick="updateCut(${ord.id}, ${item.id}, 1)" class="bg-slate-700 hover:bg-slate-600 text-white w-8 h-8 rounded-lg font-bold text-sm">+1</button>
                            <button onclick="updateCut(${ord.id}, ${item.id}, ${item.necesar - item.taiat})" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 h-8 rounded-lg text-xs font-semibold">Toate</button>
                            <button onclick="toggleDeliver(${ord.id}, ${item.id})" class="ml-2 ${item.livrat ? 'bg-blue-600 hover:bg-blue-700' : 'bg-slate-700 hover:bg-slate-600'} text-white px-3 h-8 rounded-lg text-xs font-semibold transition">
                                ${item.livrat ? 'Livrat ✓' : 'Livrare'}
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });

            if (!hasRows) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-500">Nicio piesă găsită. Adaugă o comandă nouă.</td></tr>`;
            }
        }
    </script>
</body>
</html>
